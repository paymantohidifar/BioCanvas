[project]
name = "biocanvas"
version = "0.1.0"
description = "BioCanvas is a library for biological data analysis and visualization."
authors = [
    { name = "Payman Tohidifar", email = "payman.tohidifar@gmail.com" },
]
requires-python = "==3.11.*"
dependencies = [
    "pandas>=3.0.0",
    "numpy>=2.2.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "tqdm>=4.67.0",
    "jupyter>=1.1.0",
    "ipywidgets>=8.1.0",
    "ipython>=8.0.0",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.11.*"
pixi-kernel = "*"

[tool.pixi.pypi-dependencies]
biocanvas = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/"
lint = "ruff check . && ruff format --check ."
format = "ruff format src/ tests/"

[tool.pixi.feature.dev.dependencies]
pytest = ">=8.3.0"
pytest-mock = ">=3.14.0"
ruff = ">=0.9.0,<0.16"

[tool.pixi.environments]
default = { features = ["dev"], no-default-feature = false }
