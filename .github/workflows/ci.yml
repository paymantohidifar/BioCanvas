name: BioCanvas CI Pipeline

# 1. Define the automation triggers (Events)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 2. Define the execution environment
jobs:
  test-and-lint:
    runs-on: ubuntu-latest # Spawns a clean, free cloud virtual machine

    steps:
      # Step A: Download the repository code onto the runner machine
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # Step B: Install uv and sync the locked environment
      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Sync Locked Environment
        run: uv sync --group dev --locked

      # Step C: Static Code Analysis (Linting)
      - name: Run Ruff Linter
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Step D: Execute Test Suite
      - name: Execute Test Suite
        run: uv run pytest
